<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <title>Messox — La solución MES/MOM con IA para tu fábrica</title>
    <meta
      name="description"
      content="Estamos construyendo la solución MES/MOM con IA definitiva y viable para tu fábrica."
    />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Messox" />
    <meta
      property="og:description"
      content="Estamos construyendo la solución MES/MOM con IA definitiva y viable para tu fábrica."
    />

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-black text-white font-sans antialiased">
    <!-- Fondo WebGL -->
    <canvas
      id="shader-bg"
      class="fixed inset-0 -z-10 h-full w-full"
      aria-hidden="true"
    ></canvas>

    <main
      class="relative flex min-h-dvh flex-col items-center justify-center gap-8 px-6 text-center"
    >
      <!-- H1 oculto para SEO; el logotipo es la marca visible -->
      <h1 class="sr-only">Messox</h1>

      <img
        src="/logo.png"
        alt="Messox"
        width="2190"
        height="600"
        class="w-56 max-w-[80vw] sm:w-72 md:w-80 [filter:brightness(0)_invert(1)] drop-shadow-[0_0_25px_rgba(255,255,255,0.25)]"
      />

      <p
        class="max-w-2xl text-balance text-lg font-light leading-relaxed text-white/85 sm:text-xl md:text-2xl"
      >
        Estamos construyendo la solución MES/MOM con IA definitiva y viable para
        tu fábrica.
      </p>

      <a
        href="mailto:contacto@messox.com"
        class="rounded-full border border-white/20 bg-white/5 px-6 py-3 text-sm font-medium text-white/90 backdrop-blur-sm transition hover:border-white/40 hover:bg-white/10 hover:text-white sm:text-base"
      >
        contacto@messox.com
      </a>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
